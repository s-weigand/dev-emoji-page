version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "20:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 20
    assignees:
      - s-weigand
    groups:
      runtime-dependencies:
        update-types:
          - minor
          - patch
      mui:
        patterns:
          - "@mui/**"
        update-types:
          - major
          - minor
          - patch
    rebase-strategy: "disabled"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: friday
      time: "20:00"
      timezone: Europe/Amsterdam
    assignees:
      - s-weigand
    groups:
      GH-Actions:
        update-types:
          - minor
          - patch
    rebase-strategy: "disabled"
